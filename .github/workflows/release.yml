# B15-5 (#442) — Release workflow: cross-compiled single-binary matrix.
#
# On a `v*` tag push, build `bun build --compile` binaries for
# linux/darwin/windows × x64/arm64, smoke-test the native binary per OS,
# generate a SHA256SUMS checksum manifest, and attach everything to the GitHub
# release. Runs on native runners per OS so every artifact is actually
# executable and smoke-tested.

name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            native_arch: x64
            other_arch: arm64
          - os: macos-latest
            platform: darwin
            native_arch: arm64
            other_arch: x64
          - os: windows-latest
            platform: windows
            native_arch: x64
            other_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Verify native runner architecture
        shell: bash
        run: test "$(node -p process.arch)" = "${{ matrix.native_arch }}"

      - name: Build + blackbox test (native arch)
        run: |
          bun run scripts/build-release.ts --target bun-${{ matrix.platform }}-${{ matrix.native_arch }} --outfile tenjin-${{ matrix.platform }}-${{ matrix.native_arch }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          bun run scripts/release-blackbox.ts --artifact tenjin-${{ matrix.platform }}-${{ matrix.native_arch }}${{ matrix.platform == 'windows' && '.exe' || '' }}

      - name: Build (other arch)
        run: bun run scripts/build-release.ts --target bun-${{ matrix.platform }}-${{ matrix.other_arch }} --outfile tenjin-${{ matrix.platform }}-${{ matrix.other_arch }}${{ matrix.platform == 'windows' && '.exe' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: tenjin-${{ matrix.platform }}-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Stage flat release assets and checksums
        run: |
          mkdir release
          find dist -type f -name 'tenjin-*' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -type f -name 'tenjin-*' | wc -l)" -eq 6
          cd release
          sha256sum tenjin-* > SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${FLAGS[@]}"
