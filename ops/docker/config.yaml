# Example gateway config, mounted read-only into the container at
# /data/config.yaml (see docker-compose.yml). Edit this file and restart the
# service — no image rebuild needed.
#
# SECRETS: API keys / channel tokens stay in .env — never hardcode them here.
# The listen token below must equal GATEWAY_TOKEN in .env (the container
# HEALTHCHECK authenticates against /api/health with it).

# Bot seeded into a fresh home volume on first boot (see entrypoint.sh). The
# seed name honours this value, or the $TENJIN_DEFAULT_BOT env override, and
# falls back to "default" if neither is set.
defaultBot: default

gateway:
  allowWrites: true

  # Web console + REST API. host 0.0.0.0 so the container is reachable through
  # the published port. Port must match the EXPOSE/healthcheck (3000).
  listen:
    host: 0.0.0.0
    port: 3000
    # #239: this example token MUST be replaced with a strong, unique value that
    # matches GATEWAY_TOKEN in .env. The container's entrypoint refuses to boot
    # while this is the well-known 'dev-local-token' (fail closed).
    token: dev-local-token   # <- set a strong, unique value here

  # Channels: uncomment and configure to connect the gateway to a channel.
  # telegram:
  #   enabled: true
  #   defaultBot: default
  #   allowedUsers: [123456789]   # Telegram user ids allowed to talk to the agent

  # Scheduled jobs: list as many as you want.
  # jobs:
  #   - name: morning-brief
  #     bot: default
  #     prompt: "Give me a 5-line morning brief."
  #     every: 8h
